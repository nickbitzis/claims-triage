name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Test
        run: uv run --python 3.12 --group dev pytest -q

  leakage-gate:
    # Fails if the routing policy's leakage plus missed fraud on held-out claims exceeds the rules-only baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Generate, process, train, route, evaluate, gate
        run: uv run --python 3.12 claimstriage --data-dir data/ci all --claims 60000 --gate
      - name: Policy comparison
        if: always()
        run: uv run --python 3.12 claimstriage --data-dir data/ci evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          path: data/ci/evaluation.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t claims-triage:ci .
      - name: Batch job in a container, then API smoke test
        run: |
          docker volume create claimsdata
          docker run --rm -v claimsdata:/app/data claims-triage:ci claimstriage all --claims 8000
          docker run -d --name ct -p 8834:8834 -v claimsdata:/app/data claims-triage:ci
          for i in $(seq 1 40); do curl -sf http://localhost:8834/healthz && break; sleep 1; done
          curl -sf "http://localhost:8834/api/queues/siu?limit=3"
          curl -sf http://localhost:8834/api/fnol/sample > sample.json
          curl -sf -X POST -H 'content-type: application/json' -d @sample.json http://localhost:8834/api/fnol
          curl -sf http://localhost:8834/metrics | grep ct_fnol_routed_total
          docker rm -f ct
